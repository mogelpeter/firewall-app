[package]
name = "firewall-manager"
version = "3.0.0"
edition = "2021"
description = "Windows Firewall Manager: block programs and whole folders"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.18"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
